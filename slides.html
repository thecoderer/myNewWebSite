<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Slaytlar — School Life</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="games/style.css" />
    <style>
      /* Ensure theme buttons mirror games UI */
      #themeButtons { display:flex; flex-direction:column; gap:8px; }
      #themeButtons .theme-button { display:block; width:100%; text-align:left; }
      #themeButtons .theme-button.active { background: rgba(86,181,255,0.16); border-color: rgba(86,181,255,0.4); color: var(--text); }
      /* Ensure sidebar toggle is clickable above iframe */
      .theme-sidebar, .sidebar-toggle { z-index: 9999; pointer-events: auto; }
      .theme-sidebar.is-open .sidebar-content { z-index: 9998; }
      .slides-layout { display:flex; align-items:flex-start; gap:20px; }
      .slides-main { flex:1; min-width:0; }
      @media (max-width: 900px) {
        .slides-layout { flex-direction: column; }
        .theme-sidebar {
          width: 100%;
          max-width: none;
          flex-basis: auto;
        }
      }
    </style>
    <style>
      body{font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0; color:var(--text)}
      .wrap{width:min(1320px, calc(100% - 24px)); margin:0 auto; padding:16px 0 24px}
      a.back{color:#ffd166;text-decoration:none;font-weight:600}
      h1{margin:12px 0 6px;font-size:1.5rem}
      p.lead{color:#e6d8a4}
      .iframe-container{position:relative;width:100%;padding-top:60%;background:transparent;border-radius:12px;overflow:hidden;margin-top:18px}
      .iframe-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
      footer{margin-top:28px;text-align:center;color:#bba97f;font-size:0.9rem}
    </style>
  </head>
  <body class="theme-school-life">
    <div class="wrap">
      <a class="back" href="index.html">← Anasayfaya dön</a>
      <div class="slides-layout">
        <aside class="theme-sidebar" id="themeSidebar" aria-label="Tema seçici">
          <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Temaları aç/kapat" aria-expanded="false" onclick="toggleSidebar()">
            <span class="sidebar-icon" aria-hidden="true"></span>
          </button>
          <div class="sidebar-content">
            <div class="theme-selector">
              <span>Temalar</span>
              <div id="themeButtons" class="theme-buttons"></div>
            </div>
          </div>
        </aside>

        <section class="slides-main">
          <h1 id="page-title">School Life — Tema Slaytları</h1>
          <p class="lead" id="page-desc">Aşağıdaki sunular, seçtiğiniz tema için öğretmen sunumlarını gösterir. Soldan bir tema seçin.</p>

          <div class="iframe-container" aria-label="Theme slide embed">
            <iframe id="deck-frame" src="https://1drv.ms/p/c/eb4c9558116ec339/IQR1Y7ay5ckRTraJX3HBCF-RAdY-qRkQVU9fe7LmdzYhx10?em=2&amp;wdAr=1.7777777777777777" title="Slide Viewer" allowfullscreen></iframe>
          </div>
        </section>
      </div>

      <footer>Bu sayfa temalara göre sunu önizlemeleri gösterir.</footer>
    </div>
    <script>
      // Dynamically load theme keys from games/script.js to keep sidebar in sync
      const THEME_SLIDE_MAP = {
        'SCHOOL LIFE': 'https://1drv.ms/p/c/eb4c9558116ec339/IQR1Y7ay5ckRTraJX3HBCF-RAdY-qRkQVU9fe7LmdzYhx10?em=2&wdAr=1.7777777777777777',
        'CLASSROOM LIFE': 'https://1drv.ms/p/c/eb4c9558116ec339/IQQtHZDgsmSwS5yEYILYG8T_AcCfVxh0hknqyylKXEDt3Ng?em=2&wdAr=1.7777777777777777',
        'PERSONAL LIFE': 'https://1drv.ms/p/c/eb4c9558116ec339/IQRAibELAVgNR7Mpg8I0JtTAAaOx4vWD1-a6ztXK01IVOys?em=2&wdAr=1.7777777777777777',
        'FAMILY LIFE': 'https://1drv.ms/p/c/eb4c9558116ec339/IQSm3vP1J8BUQbgym5kSJTTaAVaVWcYousgz2rTt_z5zltw?em=2&wdAr=1.7777777777777777',
        'NEIGHBOURHOOD & CITY': 'https://1drv.ms/p/c/eb4c9558116ec339/IQSrgHEc5MmaSY0N1vD12jlzAXzVZjH76VXJ-7WBb4STCLo?em=2&wdAr=1.7777777777777777',
        'LIFE IN THE WORLD': 'https://1drv.ms/p/c/eb4c9558116ec339/IQSVcYGJxoxoQ6BlZEL7r5HfARJa-1fRUeAcWBprntLutRg?em=2&wdAr=1.7777777777777777',
        'LIFE IN NATURE': 'https://1drv.ms/p/c/eb4c9558116ec339/IQS8eBnUC31cSoeCnp3Fi1H5AV7DtX9NWfqfx8tCaZ6ELuc?em=2&wdAr=1.7777777777777777',
        'LIFE IN THE UNIVERSE': 'https://1drv.ms/p/c/eb4c9558116ec339/IQSNfJ04tTWSRZCxwRyYwN0uAY9azQgEmQs6IhzkjQgKF2Y?em=2&wdAr=1.7777777777777777',
        'SCHOOL LIFE & EDUCATION': 'https://1drv.ms/p/c/eb4c9558116ec339/IQQ4phaCguwxQocnHJhHFSLNARqZ7Xmw1yAevbeqM67m8VQ?em=2&wdAr=1.7777777777777777'
      };

      function slug(s){ return encodeURIComponent(String(s).toLowerCase().replace(/\s+/g,'-').replace(/&/g,'and')) }

      const nav = document.getElementById('themeButtons');
      const iframe = document.getElementById('deck-frame');
      const title = document.getElementById('page-title');

      async function loadThemes(){
        try{
          const res = await fetch('/games/script.js');
          const txt = await res.text();
          const re = /\n\s*'([^']+)':\s*\{/g;
          let m; const themes = [];
          while((m = re.exec('\n' + txt)) !== null){
            if(!themes.includes(m[1])) themes.push(m[1]);
          }
          return themes.length ? themes : ['SCHOOL LIFE'];
        }catch(e){
          return ['SCHOOL LIFE'];
        }
      }

      (async ()=>{
        const THEMES = await loadThemes();
        THEMES.forEach(t => {
          const btn = document.createElement('button');
          btn.className = 'theme-button';
          btn.textContent = t;
          btn.onclick = () => {
            // visual active state handled by class
            document.querySelectorAll('#themeButtons .theme-button').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            title.textContent = t + ' — Tema Slaytları';
            if(THEME_SLIDE_MAP[t]){
              iframe.src = THEME_SLIDE_MAP[t];
            } else {
              iframe.src = 'assets/slides-preview.html?theme=' + slug(t);
            }
          };
          nav.appendChild(btn);
        });
        // click first theme
        document.querySelector('#themeButtons .theme-button')?.click();
        // open sidebar by default on page load; user may close with the toggle
        const sidebar = document.getElementById('themeSidebar');
        const toggle = document.getElementById('sidebarToggle');
        if(sidebar && toggle){ sidebar.classList.add('is-open'); toggle.setAttribute('aria-expanded','true'); }
        // sidebar toggle behavior
        toggle.addEventListener('click', ()=>{
          const open = sidebar.classList.toggle('is-open');
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      })();
      // Extra fallback: ensure a global toggleSidebar and attach on DOMContentLoaded
      function toggleSidebar(){
        const sidebar = document.getElementById('themeSidebar');
        const btn = document.getElementById('sidebarToggle');
        if(!sidebar || !btn) return;
        const open = sidebar.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      (function attachToggle(){
        const attach = ()=>{ const btn = document.getElementById('sidebarToggle'); if(btn) btn.addEventListener('click', toggleSidebar); };
        if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attach); else attach();
      })();
    </script>
  </body>
</html>
