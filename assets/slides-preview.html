<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slides Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-cyan-600 via-slate-900 to-fuchsia-700 p-6">
      <div class="w-full max-w-3xl rounded-3xl border border-white/10 bg-slate-900/80 p-8 shadow-2xl" id="deck">
        <p class="text-sm uppercase tracking-[0.35em] text-cyan-300">Slide deck preview</p>
        <h1 class="mt-3 text-3xl font-black text-white" id="deck-title">English Lesson Flow</h1>
        <p class="mt-2 text-sm text-slate-300" id="deck-sub">A quick preview placeholder. Use the main Slides page to open full theme presentations.</p>
        <div class="mt-8 grid gap-4 md:grid-cols-3">
          <div class="rounded-2xl bg-slate-950/70 p-4">
            <p class="text-sm text-slate-400">Warm-up</p>
            <p class="mt-2 text-lg font-semibold">Quick questions</p>
          </div>
          <div class="rounded-2xl bg-slate-950/70 p-4">
            <p class="text-sm text-slate-400">Grammar</p>
            <p class="mt-2 text-lg font-semibold">Target structure</p>
          </div>
          <div class="rounded-2xl bg-slate-950/70 p-4">
            <p class="text-sm text-slate-400">Practice</p>
            <p class="mt-2 text-lg font-semibold">Speaking task</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Read optional ?theme= query and update preview title
      (function(){
        const params = new URLSearchParams(location.search);
        const theme = params.get('theme');
        if(theme){
          const decoded = decodeURIComponent(theme).replace(/[-_]/g,' ').toUpperCase();
          const titleEl = document.getElementById('deck-title');
          const subEl = document.getElementById('deck-sub');
          titleEl.textContent = decoded;
          subEl.textContent = 'Bu, "' + decoded + '" temasına ait önizleme yer tutucusudur.';
        }
      })();
    </script>
  </body>
</html>
